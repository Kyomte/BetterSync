[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Kyomte/BetterSync"
publish = false

[workspace.dependencies]
bsync-core = { path = "crates/core" }
bsync-index = { path = "crates/index" }
bsync-fs = { path = "crates/fs" }
bsync-proto = { path = "crates/proto" }
bsync-net = { path = "crates/net" }
bsync-engine = { path = "crates/engine" }
bsync-sim = { path = "crates/sim" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
blake3 = "1"
fastcdc = "5"
notify = "8"
notify-debouncer-full = "0.7"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
bsyncd = { path = "bins/bsyncd" }
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
